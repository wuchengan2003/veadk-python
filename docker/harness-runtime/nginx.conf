worker_processes auto;
pid /tmp/agentkit-studio-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_max_body_size 0;
    client_body_temp_path /tmp/agentkit-studio-client;
    proxy_temp_path /tmp/agentkit-studio-proxy;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    map $http_x_agentkit_target $runtime_upstream {
        default 127.0.0.1:8001;
        studio 127.0.0.1:8002;
    }
    map $http_x_agentkit_target $runtime_disabled {
        default @@HARNESS_DISABLED@@;
        studio @@STUDIO_DISABLED@@;
    }
    # The platform may terminate TLS before this HTTP listener. Only trust the
    # forwarded scheme when this container is behind the authenticated gateway.
    map $http_x_forwarded_proto $external_scheme {
        default $scheme;
        https https;
        http http;
    }
    server {
        listen 8000;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $external_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        location / {
            if ($runtime_disabled = 1) { return 503; }
            proxy_pass http://$runtime_upstream;
        }
    }
}
